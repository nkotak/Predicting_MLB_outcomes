name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest library versions the package supports.
          - name: oldest supported
            python: "3.10"
            pins: "numpy==1.26.4 pandas==2.2.3 scikit-learn==1.6.1 pyarrow==15.0.2"
          # Whatever is newest today, to catch breaking changes early.
          - name: latest
            python: "3.13"
            pins: ""
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ${{ matrix.pins }}
      - name: Show versions
        run: python -c "import numpy, pandas, sklearn, pyarrow; print(numpy.__version__, pandas.__version__, sklearn.__version__, pyarrow.__version__)"
      - name: Run tests
        run: pytest
