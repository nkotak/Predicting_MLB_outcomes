[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-predict"
version = "1.1.0"
description = "Win probabilities for MLB games, tested against real betting odds, with a learning agent for paper bets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.6,<2",
    "pyarrow>=15",
    "requests>=2.31,<3",
    "joblib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mlb = "mlb_predict.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
